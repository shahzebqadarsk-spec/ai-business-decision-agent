# Development stack: PostgreSQL + FastAPI backend + Vite frontend.
# Usage: cp .env.example .env  (edit passwords)  &&  docker compose up --build
name: ai-business-decision-agent

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-abda}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Set ANALYTICS_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database host is the service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-abda}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abda}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  pgdata:
