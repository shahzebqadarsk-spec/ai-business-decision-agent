[project]
name = "abda-backend"
version = "0.1.0"
description = "AI Business Decision Agent - backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "python-magic>=0.4.27",
    "PyYAML>=6.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests", "../synthetic_data/generator"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S108"]
"app/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "../synthetic_data/generator"]
strict = true
mypy_path = ["../synthetic_data"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.synthetic.test_planted_problems"
disable_error_code = ["index", "arg-type", "union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../synthetic_data"]
